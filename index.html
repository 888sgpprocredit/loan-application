<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Application</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f3f5f7;
    color: #222;
}

.container {
    max-width: 520px;
    margin: 40px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
}

.language-switcher {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 20px;
}

.language-switcher button {
    width: auto;
    padding: 8px 14px;
    font-size: 14px;
    background: #eee;
    color: #222;
}

.language-switcher button.active {
    background: #111;
    color: white;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.required {
    color: red;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

.message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    display: none;
}

.success {
    display: block;
    background: #e8f7ee;
    color: #168344;
}

.error {
    display: block;
    background: #fdecec;
    color: #c62828;
}


/* Brand / WhatsApp design */
:root {
    --brand-blue: #125dcc;
    --brand-dark: #123d78;
    --brand-light: #eef6ff;
    --whatsapp: #18b95b;
}

body {
    background: linear-gradient(180deg, #eef7ff 0%, #f7fbff 100%);
}

.container {
    max-width: 620px;
    margin: 28px auto;
    padding: 15px;
}

.card {
    padding: 28px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(18,61,120,0.10);
}

.brand {
    text-align: center;
    margin-bottom: 14px;
}

.brand-logo {
    width: 58px;
    height: 58px;
    margin: 0 auto 8px;
    border-radius: 50%;
    background: var(--brand-blue);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 23px;
    font-weight: 800;
    box-shadow: 0 6px 18px rgba(18,93,204,0.25);
    position: relative;
}

.brand-logo::after {
    content: "";
    position: absolute;
    width: 44px;
    height: 18px;
    border: 3px solid #f5b51b;
    border-left-color: transparent;
    border-radius: 50%;
    transform: rotate(-18deg);
}

.brand-name {
    font-size: 24px;
    font-weight: 800;
    color: var(--brand-dark);
    letter-spacing: .2px;
}

.brand-tagline {
    color: #6a7f9d;
    font-size: 14px;
    margin-top: 3px;
}

.hero {
    background: linear-gradient(135deg, #edf6ff, #ffffff);
    border-radius: 16px;
    padding: 18px;
    margin: 18px 0 22px;
    text-align: center;
}

.hero-title {
    font-size: 27px;
    font-weight: 800;
    color: var(--brand-dark);
    margin-bottom: 7px;
}

.hero-text {
    color: #607797;
    font-size: 15px;
    line-height: 1.6;
}

.language-switcher button {
    border: 1px solid #d7e2f0;
    background: white;
    color: var(--brand-blue);
}

.language-switcher button.active {
    background: var(--brand-blue);
    color: white;
}

input, textarea {
    border: 1px solid #d7e0ea;
    transition: .2s;
}

input:focus, textarea:focus {
    border-color: var(--brand-blue);
    box-shadow: 0 0 0 3px rgba(18,93,204,.10);
}

button[type="submit"] {
    background: linear-gradient(135deg, #1265dc, #0c4eae);
    box-shadow: 0 7px 18px rgba(18,93,204,.20);
}

.whatsapp {
    display: block;
    margin-top: 18px;
    padding: 16px 18px;
    border-radius: 13px;
    background: var(--whatsapp);
    color: white;
    text-align: center;
    text-decoration: none;
    font-weight: 800;
    font-size: 17px;
    box-shadow: 0 7px 18px rgba(24,185,91,.20);
}

.whatsapp small {
    display: block;
    margin-top: 4px;
    font-weight: 400;
    font-size: 13px;
}

.footer-brand {
    text-align: center;
    color: var(--brand-dark);
    font-weight: 800;
    margin-top: 22px;
    font-size: 16px;
}

.footer-note {
    text-align: center;
    color: #7d8fa8;
    font-size: 12px;
    margin-top: 5px;
}

@media (max-width: 560px) {
    .container { margin: 10px auto; }
    .card { padding: 20px; }
    .brand-name { font-size: 21px; }
    .hero-title { font-size: 24px; }
}

</style>

</head>


<body>


<div class="container">

<div class="card">

<div class="brand">
    <div class="brand-logo">888</div>
    <div class="brand-name">888 SG Pro Credit</div>
    <div class="brand-tagline">Your Trusted Loan Partner</div>
</div>

<div class="hero">
    <div class="hero-title" id="heroTitle">贷款申请</div>
    <div class="hero-text" id="heroText">简单申请 · 快速回复 · 专业服务</div>
</div>
<div class="language-switcher">
<button type="button" id="zhButton" class="active">中文</button>
<button type="button" id="enButton">English</button>
</div>

<div class="subtitle" id="subtitle">
请填写以下资料，我们会尽快与您联系
</div>


<form id="loanForm">


<div class="form-group">

<label id="nameLabel">
姓名 <span class="required">*</span>
</label>

<input
type="text"
id="name"
placeholder="请输入您的姓名"
required>

</div>


<div class="form-group">

<label id="dobLabel">
出生日期 <span class="required">*</span>
</label>

<input
type="date"
id="dob"
required>

</div>


<div class="form-group">

<label id="addressLabel">
地址 <span class="required">*</span>
</label>

<textarea
id="address"
placeholder="请输入您的地址"
required></textarea>

</div>


<div class="form-group">

<label id="phoneLabel">
手机号码 <span class="required">*</span>
</label>

<input
type="tel"
id="phone"
placeholder="请输入手机号码"
required>

</div>


<div class="form-group">

<label id="jobLabel">
工作 <span class="required">*</span>
</label>

<input
type="text"
id="job"
placeholder="例如：Sales / Business Owner"
required>

</div>


<div class="form-group">

<label id="amountLabel">
贷款额度 <span class="required">*</span>
</label>

<input
type="number"
id="amount"
placeholder="例如：50000"
min="0"
required>

</div>


<button
type="submit"
id="submitButton">

提交资料

</button>


<div
id="message"
class="message">
</div>



<a class="whatsapp" id="whatsappLink" href="https://wa.me/6583091814" target="_blank" rel="noopener">
    <span id="whatsappTitle">WhatsApp 联系我们</span>
    <small id="whatsappText">有任何疑问？立即咨询我们！</small>
</a>

<div class="footer-brand">888 SG Pro Credit</div>
<div class="footer-note" id="footerNote">您的信任 · 我们的承诺</div>

</form>

</div>

</div>


<script>


// ========================================
// 把这里换成你的 Google Apps Script URL
// ========================================

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzq1PC3HhROq0_y2bdKJaiZjPbS_-SZxlGYKrAvJgfA9ybpwAC594k9Zb0VehGI_lGq/exec";


// ========================================
// 不需要修改下面的内容
// ========================================

const form =
document.getElementById("loanForm");

const button =
document.getElementById("submitButton");

const message =
document.getElementById("message");


form.addEventListener("submit", function(event) {

    event.preventDefault();

    button.disabled = true;

    button.innerText = currentLanguage === "zh" ? "提交中..." : "Submitting...";


    const formData = new FormData();


    formData.append(
        "name",
        document.getElementById("name").value
    );

    formData.append(
        "dob",
        document.getElementById("dob").value
    );

    formData.append(
        "address",
        document.getElementById("address").value
    );

    formData.append(
        "phone",
        document.getElementById("phone").value
    );

    formData.append(
        "job",
        document.getElementById("job").value
    );

    formData.append(
        "amount",
        document.getElementById("amount").value
    );


    fetch(SCRIPT_URL, {

        method: "POST",

        mode: "no-cors",

        body: formData

    })
    .then(function() {

        message.className =
            "message success";

        message.innerText =
            currentLanguage === "zh"
                ? "资料提交成功！我们会尽快与您联系。"
                : "Application submitted successfully! We will contact you soon.";

        message.style.display =
            "block";

        form.reset();

        button.disabled = false;

        button.innerText =
            currentLanguage === "zh" ? "提交资料" : "Submit Application";

    })
    .catch(function(error) {

        console.error(error);

        message.className =
            "message error";

        message.innerText =
            currentLanguage === "zh"
                ? "提交失败，请稍后再试。"
                : "Submission failed. Please try again later.";

        message.style.display =
            "block";

        button.disabled = false;

        button.innerText =
            currentLanguage === "zh" ? "提交资料" : "Submit Application";

    });

});



let currentLanguage = "zh";

const translations = {
    zh: {
        subtitle: "请填写以下资料，我们会尽快与您联系",
        name: "姓名",
        namePlaceholder: "请输入您的姓名",
        dob: "出生日期",
        address: "地址",
        addressPlaceholder: "请输入您的地址",
        phone: "手机号码",
        phonePlaceholder: "请输入手机号码",
        job: "工作",
        jobPlaceholder: "例如：Sales / Business Owner",
        amount: "贷款额度",
        amountPlaceholder: "例如：50000",
        submit: "提交资料",
        heroTitle: "贷款申请",
        heroText: "简单申请 · 快速回复 · 专业服务",
        whatsappTitle: "WhatsApp 联系我们",
        whatsappText: "有任何疑问？立即咨询我们！",
        whatsappMessage: "我对你们的服务非常感兴趣，想了解更多！",
        footerNote: "您的信任 · 我们的承诺"
    },
    en: {
        subtitle: "Please fill in the details below and we will contact you soon.",
        name: "Full Name",
        namePlaceholder: "Please enter your full name",
        dob: "Date of Birth",
        address: "Address",
        addressPlaceholder: "Please enter your address",
        phone: "Mobile Number",
        phonePlaceholder: "Please enter your mobile number",
        job: "Occupation",
        jobPlaceholder: "e.g. Sales / Business Owner",
        amount: "Loan Amount",
        amountPlaceholder: "e.g. 50000",
        submit: "Submit Application",
        heroTitle: "Loan Application",
        heroText: "Simple application · Fast response · Professional service",
        whatsappTitle: "Contact us on WhatsApp",
        whatsappText: "Have any questions? Chat with us now!",
        whatsappMessage: "I am very interested in your services and would like to know more!",
        footerNote: "Your trust · Our commitment"
    }
};

function setLanguage(lang) {
    currentLanguage = lang;
    const t = translations[lang];

    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.getElementById("subtitle").innerText = t.subtitle;
    document.getElementById("heroTitle").innerText = t.heroTitle;
    document.getElementById("heroText").innerText = t.heroText;
    document.getElementById("whatsappTitle").innerText = t.whatsappTitle;
    document.getElementById("whatsappText").innerText = t.whatsappText;
    document.getElementById("whatsappLink").href =
        "https://wa.me/6583091814?text=" + encodeURIComponent(t.whatsappMessage);
    document.getElementById("footerNote").innerText = t.footerNote;

    document.getElementById("nameLabel").innerHTML = t.name + ' <span class="required">*</span>';
    document.getElementById("dobLabel").innerHTML = t.dob + ' <span class="required">*</span>';
    document.getElementById("addressLabel").innerHTML = t.address + ' <span class="required">*</span>';
    document.getElementById("phoneLabel").innerHTML = t.phone + ' <span class="required">*</span>';
    document.getElementById("jobLabel").innerHTML = t.job + ' <span class="required">*</span>';
    document.getElementById("amountLabel").innerHTML = t.amount + ' <span class="required">*</span>';

    document.getElementById("name").placeholder = t.namePlaceholder;
    document.getElementById("address").placeholder = t.addressPlaceholder;
    document.getElementById("phone").placeholder = t.phonePlaceholder;
    document.getElementById("job").placeholder = t.jobPlaceholder;
    document.getElementById("amount").placeholder = t.amountPlaceholder;

    document.getElementById("submitButton").innerText = t.submit;

    document.getElementById("zhButton").classList.toggle("active", lang === "zh");
    document.getElementById("enButton").classList.toggle("active", lang === "en");
}

document.getElementById("zhButton").addEventListener("click", () => setLanguage("zh"));
document.getElementById("enButton").addEventListener("click", () => setLanguage("en"));
setLanguage("zh");

</script>


</body>

</html>
