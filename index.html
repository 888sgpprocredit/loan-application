<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loan Application</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #f3f5f7;
    color: #222;
}

.container {
    max-width: 520px;
    margin: 40px auto;
    padding: 15px;
}

.card {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 5px 25px rgba(0,0,0,0.08);
}

.logo {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-bottom: 30px;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
}

.required {
    color: red;
}

input,
textarea {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 8px;
    background: #111;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    background: #999;
}

.message {
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    display: none;
}

.success {
    display: block;
    background: #e8f7ee;
    color: #168344;
}

.error {
    display: block;
    background: #fdecec;
    color: #c62828;
}

</style>

</head>


<body>


<div class="container">

<div class="card">

<div class="logo">
Loan Application
</div>

<div class="subtitle">
请填写以下资料，我们会尽快与您联系
</div>


<form id="loanForm">


<div class="form-group">

<label>
姓名 <span class="required">*</span>
</label>

<input
type="text"
id="name"
placeholder="请输入您的姓名"
required>

</div>


<div class="form-group">

<label>
地址 <span class="required">*</span>
</label>

<textarea
id="address"
placeholder="请输入您的地址"
required></textarea>

</div>


<div class="form-group">

<label>
手机号码 <span class="required">*</span>
</label>

<input
type="tel"
id="phone"
placeholder="请输入手机号码"
required>

</div>


<div class="form-group">

<label>
工作 <span class="required">*</span>
</label>

<input
type="text"
id="job"
placeholder="例如：Sales / Business Owner"
required>

</div>


<div class="form-group">

<label>
贷款额度 <span class="required">*</span>
</label>

<input
type="number"
id="amount"
placeholder="例如：50000"
min="0"
required>

</div>


<button
type="submit"
id="submitButton">

提交资料

</button>


<div
id="message"
class="message">
</div>


</form>

</div>

</div>


<script>


// ========================================
// 把这里换成你的 Google Apps Script URL
// ========================================

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzq1PC3HhROq0_y2bdKJaiZjPbS_-SZxlGYKrAvJgfA9ybpwAC594k9Zb0VehGI_lGq/exec";


// ========================================
// 不需要修改下面的内容
// ========================================

const form =
document.getElementById("loanForm");

const button =
document.getElementById("submitButton");

const message =
document.getElementById("message");


form.addEventListener("submit", function(event) {

    event.preventDefault();

    button.disabled = true;

    button.innerText = "提交中...";


    const formData = new FormData();


    formData.append(
        "name",
        document.getElementById("name").value
    );

    formData.append(
        "address",
        document.getElementById("address").value
    );

    formData.append(
        "phone",
        document.getElementById("phone").value
    );

    formData.append(
        "job",
        document.getElementById("job").value
    );

    formData.append(
        "amount",
        document.getElementById("amount").value
    );


    fetch(SCRIPT_URL, {

        method: "POST",

        mode: "no-cors",

        body: formData

    })
    .then(function() {

        message.className =
            "message success";

        message.innerText =
            "资料提交成功！我们会尽快与您联系。";

        message.style.display =
            "block";

        form.reset();

        button.disabled = false;

        button.innerText =
            "提交资料";

    })
    .catch(function(error) {

        console.error(error);

        message.className =
            "message error";

        message.innerText =
            "提交失败，请稍后再试。";

        message.style.display =
            "block";

        button.disabled = false;

        button.innerText =
            "提交资料";

    });

});


</script>


</body>

</html>
